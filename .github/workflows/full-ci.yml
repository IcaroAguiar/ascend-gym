# Heavy checks that a pull request does not run by default. Label a PR `run-full-ci` (or run it by hand).
# Kept apart from test.yml so that labelling never re-emits that workflow's checks as skipped.
#
# Today that is the API image build: it is the only place that proves the bundled Claude CLI and Codex
# runtimes install and start on alpine (the Dockerfile runs `codex --version` as a build step). The
# whole unit suite is already the per-PR `verify` job, so the PR label adds the image only.
# Use it on PRs that touch api/Dockerfile, api/package*.json or the Node base image.
# No push-to-main trigger: publishing images stays manual (docker-publish.yml).
name: Full CI

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-image:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-full-ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-full-ci'))
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.ACTIONS_RUNNER_LABELS_CI || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
