# Runs on pull requests too — the other two workflows only fire on push to main, so
# contributed changes used to reach main without anything ever having been run.
name: Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/build-coach-library.mjs'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/build-coach-library.mjs'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json
      # Frontend Coach parity tests import the server payload and job modules, so their runtime
      # dependencies must exist even though Vitest itself runs from frontend/.
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      # Tests use the fixture provider, but loading the adapter graph still requires the pinned
      # SDK packages. Installing them does not contact an AI provider or require credentials.
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api
      # The API's copy of the exercise catalogue is generated and committed. A dataset change
      # that forgets to regenerate it would otherwise only surface as "the Coach can't find
      # that exercise" on somebody's instance.
      - run: node scripts/build-coach-library.mjs --check

  # Building the api image is the only place that proves the bundled Claude CLI actually
  # installs and starts on alpine — the Dockerfile runs `claude --version` as a build step.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
