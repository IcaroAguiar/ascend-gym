# The one job a pull request runs: tests, build and generated-file checks of the two packages.
# Heavy checks (the API docker image) are in full-ci.yml and run on request.
name: CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/build-coach-library.mjs'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Hosted by default. ACTIONS_RUNNER_LABELS_CI redirects to the self-hosted runner only while the
    # monthly quota is exhausted; fork PRs always stay on hosted (untrusted code).
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.ACTIONS_RUNNER_LABELS_CI || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json
      # Frontend Coach parity tests import the server payload and job modules, so their runtime
      # dependencies must exist even though Vitest itself runs from frontend/.
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      # Tests use the fixture provider, but loading the adapter graph still requires the pinned
      # SDK packages. Installing them does not contact an AI provider or require credentials.
      - run: npm test
        working-directory: api
      # The API's copy of the exercise catalogue is generated and committed. A dataset change
      # that forgets to regenerate it would otherwise only surface as "the Coach can't find
      # that exercise" on somebody's instance.
      - run: node scripts/build-coach-library.mjs --check
      - name: Work-time budget (5 min)
        run: |
          elapsed=$(( $(date +%s) - START ))
          echo "verify work time: ${elapsed}s of 300s"
          [ "$elapsed" -le 300 ] || { echo "::error::Over the 5 min budget: move weight out of this job, do not raise the budget."; exit 1; }
