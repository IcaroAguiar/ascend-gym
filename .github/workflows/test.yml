# The one job a pull request runs: tests, build and generated-file checks of the two packages.
# Heavy checks (the API docker image) are in full-ci.yml and run on request.
name: CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/build-coach-library.mjs'
      - '.github/workflows/test.yml'
  # Direct pushes to main never went through a PR. When the pushed tree is the one a PR already
  # verified, the job exits after the gate step instead of repeating the same checks.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/build-coach-library.mjs'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Hosted by default. ACTIONS_RUNNER_LABELS_CI redirects to the self-hosted runner only while the
    # monthly quota is exhausted; fork PRs always stay on hosted (untrusted code).
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.ACTIONS_RUNNER_LABELS_CI || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # lists the PRs that contain a pushed commit
      actions: read # reads the pull-request workflow runs and their jobs
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      # A pull request tests its own head commit, not the synthetic merge: the run's head_sha is then
      # the tested commit, which is what lets main compare trees reliably. A head that is behind
      # main simply never matches, so main runs everything.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Gate (push to main only)
        id: gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # Skipping needs proof that a pull_request run of this very workflow file, in this repository,
        # passed `verify` on a head whose tree is the pushed tree. Check and status names are not
        # proof: any workflow can create a check called `verify`. Any API error or doubt, and every
        # fork, leaves skip=false so the whole job runs; the step itself always succeeds.
        run: |
          set -o pipefail
          repo="$GITHUB_REPOSITORY"
          workflow=".github/workflows/test.yml"

          verified_tree() {
            local tree head head_tree run_ids run_id passed
            tree=$(git rev-parse "$GITHUB_SHA^{tree}") || return 1
            local heads
            heads=$(gh api --paginate "repos/$repo/commits/$GITHUB_SHA/pulls" \
              | jq -r --arg repo "$repo" '.[] | select(.head.repo.full_name == $repo) | .head.sha') || return 1
            for head in $heads; do
              head_tree=$(gh api "repos/$repo/git/commits/$head" --jq .tree.sha) || return 1
              [ "$head_tree" = "$tree" ] || continue
              run_ids=$(gh api "repos/$repo/actions/workflows/test.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=100" \
                | jq -r --arg repo "$repo" --arg path "$workflow" --arg head "$head" \
                  '.workflow_runs[] | select(.path == $path and .event == "pull_request" and .head_sha == $head and .conclusion == "success" and .repository.full_name == $repo and .head_repository.full_name == $repo) | .id') || return 1
              for run_id in $run_ids; do
                passed=$(gh api "repos/$repo/actions/runs/$run_id/jobs?per_page=100" \
                  | jq '[.jobs[] | select(.name == "verify" and .conclusion == "success")] | length') || return 1
                if [ "$passed" -gt 0 ]; then
                  echo "Tree $tree was verified by run $run_id on PR head $head: nothing to rerun."
                  return 0
                fi
              done
            done
            return 1
          }

          if verified_tree; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No proof of an earlier verification: running everything."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json
      # Frontend Coach parity tests import the server payload and job modules, so their runtime
      # dependencies must exist even though Vitest itself runs from frontend/.
      - run: npm ci
        if: steps.gate.outputs.skip != 'true'
        working-directory: api
      - run: npm ci
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
      - run: npm test
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
      # Tests use the fixture provider, but loading the adapter graph still requires the pinned
      # SDK packages. Installing them does not contact an AI provider or require credentials.
      - run: npm test
        if: steps.gate.outputs.skip != 'true'
        working-directory: api
      # The API's copy of the exercise catalogue is generated and committed. A dataset change
      # that forgets to regenerate it would otherwise only surface as "the Coach can't find
      # that exercise" on somebody's instance.
      - run: node scripts/build-coach-library.mjs --check
        if: steps.gate.outputs.skip != 'true'
      - name: Work-time budget (5 min)
        run: |
          elapsed=$(( $(date +%s) - START ))
          echo "verify work time: ${elapsed}s of 300s"
          [ "$elapsed" -le 300 ] || { echo "::error::Over the 5 min budget: move weight out of this job, do not raise the budget."; exit 1; }
